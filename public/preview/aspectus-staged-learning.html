<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aspectus Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#373435; --orange:#FAA954; --green:#00A859; --red:#9B1D20;
  --orange-text:#A55F12; --green-text:#00753E;
  --bg:#FFFBF6; --surface:#FFFFFF; --band:#FDEBDC; --line:#EADFD3; --muted:#6B6466;
  --t1:#373435; --t2:#FAA954; --t3:#00A859;
  --t1-soft:#E9E6E6; --t2-soft:#FEEBD5; --t3-soft:#D3F2E2; --red-soft:#F7E1E1;
  --on-t1:#FFFFFF; --on-t2:#373435; --on-t3:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F2EEEC; --bg:#1E1C1D; --surface:#292627; --band:#33292A; --line:#423C3D; --muted:#B5ACAE;
    --orange-text:#FAA954; --green-text:#3DD68C;
    --t1:#CFCACB; --t1-soft:#353132; --t2-soft:#3E3122; --t3-soft:#173A29; --red-soft:#3D1F20; --red:#E26A6D;
    --on-t1:#1E1C1D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F2EEEC; --bg:#1E1C1D; --surface:#292627; --band:#33292A; --line:#423C3D; --muted:#B5ACAE;
  --orange-text:#FAA954; --green-text:#3DD68C;
  --t1:#CFCACB; --t1-soft:#353132; --t2-soft:#3E3122; --t3-soft:#173A29; --red-soft:#3D1F20; --red:#E26A6D;
  --on-t1:#1E1C1D; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:clamp(2.1rem,7vw,3.2rem);font-weight:800;letter-spacing:-0.02em}
h2{font-size:1.55rem;font-weight:700;letter-spacing:-0.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:.5em 0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.1rem;background:none;border:0;color:var(--ink);padding:0}
.brand svg{width:30px;height:30px}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;color:var(--muted);padding:8px 10px;border-radius:8px;font-size:.95rem}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--band);font-weight:700}
main{padding:28px 0 64px}
.hero{background:var(--band);border-radius:0 0 28px 28px;padding:28px 0 32px;margin-top:-28px;margin-bottom:28px}
.kicker{color:var(--muted);font-size:.95rem;margin:0 0 6px}
.lede{font-size:1.1rem;max-width:34em}
.sunpath{display:flex;gap:6px;margin-top:22px}
.sunpath .seg{flex:1}
.sunpath .bar{height:12px;border-radius:6px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.sunpath .fill{height:100%}
.sunpath .lbl{font-size:.8rem;color:var(--muted);margin-top:6px}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--bg);text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.green{background:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
section.block{margin:36px 0}
.track-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;transform:translateY(1px)}
.mods{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink)}
.mod:hover{border-color:var(--muted)}
.ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;border:3px solid var(--tc);color:var(--ink)}
.ring.prog{background:linear-gradient(to top,var(--tc-soft) 50%,transparent 50%)}
.ring.done{background:var(--tc);color:var(--on-tc)}
.mod .meta{font-size:.88rem;color:var(--muted)}
.badge{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--t3-soft);color:var(--green-text)}
.badge.wait{background:var(--band);color:var(--muted)}
.milestones{display:grid;gap:12px}
.ms{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ms h3{display:flex;justify-content:space-between;gap:10px}
.ms ul{margin:8px 0 0;padding-left:1.2em}
.ms li{margin:4px 0}
.note{font-size:.9rem;color:var(--muted)}
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.day b{font-family:"Bricolage Grotesque",sans-serif}
.day.today b{color:var(--orange-text)}
/* module page */
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:14px}
.modhead{border-left:6px solid var(--tc);padding-left:16px;margin-bottom:24px}
.prose h3{margin:28px 0 8px}
.prose ul,.prose ol{padding-left:1.25em}
.prose li{margin:5px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h4{margin:0 0 4px;font-size:1.05rem}
.warn{background:var(--red-soft);border-left:5px solid var(--red);border-radius:10px;padding:14px 16px;margin:16px 0}
.warn strong:first-child{color:var(--red)}
.tip{background:var(--t2-soft);border-left:5px solid var(--orange);border-radius:10px;padding:14px 16px;margin:16px 0}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.93rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{background:var(--band);font-weight:700}
tr:last-child td{border-bottom:0}
.stage{margin:40px 0 0;padding-top:24px;border-top:2px dashed var(--line)}
.stage .label{font-size:.9rem;color:var(--muted)}
.q{margin:20px 0}
.q p.qt{font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--green);background:var(--t3-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.fb{font-size:.95rem;padding:8px 2px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:150px;resize:vertical}
.saved{font-size:.85rem;color:var(--green-text);min-height:1.2em}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:28px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--green);flex:none;margin-top:3px}
pre.sum{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:340px;overflow:auto}
.cert{background:#fff;color:#373435;border:2px solid #373435;border-radius:6px;padding:40px 28px;text-align:center;margin-top:20px;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:1px solid #FAA954;border-radius:4px;pointer-events:none}
.cert h2{font-size:2rem;margin:10px 0}
.cert .name{font-family:"Bricolage Grotesque",sans-serif;font-size:2.4rem;font-weight:800;margin:14px 0}
.cert .stripe{height:8px;display:flex;margin:24px auto 0;max-width:260px}
.cert .stripe span{flex:1}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:.88rem}
.hidden{display:none!important}
@media (max-width:520px){
  .next{flex-direction:column;align-items:flex-start}
  nav.tabs button{padding:8px 7px;font-size:.88rem}
  .brand span{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .sunpath .fill{transition:width .8s ease}
}
@media print{
  header.top,footer,.no-print{display:none!important}
  body{background:#fff}
}

/* ===== Aspectus branded experience • 2026 refresh ===== */
:root{--bg:#FAFAF7;--surface:#FFFFFF;--band:#FFF2DF;--line:#E9E5DF;--muted:#686767;--shadow:0 8px 30px rgba(55,52,53,.045)}
body{background:var(--bg);font-size:16px;line-height:1.62}
.top{box-shadow:0 1px 16px rgba(55,52,53,.035)}
.top .wrap{max-width:1100px;height:76px}
.wrap{max-width:860px}
.brand{gap:12px;min-width:0}
.brand img{height:47px;max-width:155px;width:auto;object-fit:contain;display:block}
.brand-logo-fallback{font-size:1.32rem;letter-spacing:-.06em;font-weight:800;line-height:1;color:var(--ink)}
.brand-logo-fallback::first-letter{color:var(--green)}
.brand-caption{font-family:'Atkinson Hyperlegible',sans-serif;font-size:.67rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-top:4px}
nav.tabs{background:#F3F1ED;border-radius:100px;padding:4px;gap:2px}
nav.tabs button{padding:9px 16px;border-radius:100px;font-weight:700}
nav.tabs button[aria-current='page']{background:var(--surface);color:var(--ink);box-shadow:0 2px 7px rgba(55,52,53,.1)}
.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(115deg,#FFF2E0 0%,#FFFAF2 65%,#EDF8EF 100%);border-radius:0 0 36px 36px;border-bottom:1px solid #F0E7DE;padding:57px 0 40px}
.hero:before{content:'';position:absolute;width:350px;height:350px;border-radius:50%;border:60px solid rgba(0,168,89,.09);right:-150px;top:-130px;z-index:-1}
.hero:after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(250,169,84,.14);right:20%;bottom:-220px;z-index:-1}
.hero .wrap{position:relative}
.kicker{font-size:.78rem;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#7B673D}
.hero h1{max-width:670px;font-size:clamp(2.7rem,7vw,4.45rem);letter-spacing:-.055em}
.hero .lede{font-size:1.08rem;line-height:1.68;max-width:600px;color:#54514D}
.hero .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #F5DEC3;border-radius:100px;padding:6px 13px;margin-bottom:18px;color:#795019;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.hero .hero-eyebrow:before{content:'';height:8px;width:8px;background:var(--green);border-radius:50%}
.sunpath{gap:12px;margin-top:32px;max-width:660px}
.sunpath .bar{height:9px;border:0;background:#E9E3D9}
.sunpath .lbl{font-weight:700;color:#5F5D59}
.next{margin-top:28px;padding:22px 24px;box-shadow:0 10px 35px rgba(55,52,53,.07);border-color:#E9DDD0}
.next h3{font-size:1.15rem}
.btn{transition:transform .18s ease,box-shadow .18s ease;background:var(--ink);color:white}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px rgba(55,52,53,.15)}
.btn.green{background:var(--green);color:#fff}
section.block{margin:40px 0}
.track-h{align-items:center;margin-bottom:16px;gap:12px}
.track-h h2{font-size:1.58rem}
.dot{height:15px;width:6px;border-radius:8px;transform:none}
.mods{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.mod{grid-template-columns:47px 1fr;position:relative;min-height:112px;border:1px solid var(--line);box-shadow:var(--shadow);padding:19px;border-radius:19px;gap:15px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.mod:hover{transform:translateY(-2px);border-color:var(--tc);box-shadow:0 11px 25px rgba(55,52,53,.09)}
.mod .badge{grid-column:2;justify-self:start;margin-top:-4px}
.mod .meta{display:inline-block;margin-top:5px}
.ring{width:46px;height:46px}
.ms,.card{box-shadow:var(--shadow)}
.ms{border-radius:17px;padding:20px 23px}
.ms h3{font-size:1.08rem}
.day{padding:19px 0}
.day b{color:var(--green-text)}
.modhead{background:linear-gradient(90deg,var(--tc-soft),transparent);padding:24px 24px 24px 28px;border-radius:0 18px 18px 0}
.modhead h1{letter-spacing:-.04em}
.prose{line-height:1.76}
.prose h3{padding-top:8px}
.prose .card{padding:21px 23px;border-radius:17px}
.stage{border-top:1px solid var(--line);margin-top:45px}
.stage .label{text-transform:uppercase;font-weight:800;letter-spacing:.11em;font-size:.77rem;color:var(--green-text)}
.opt{transition:border-color .16s ease,background .16s ease}
.opt:focus-visible,.mod:focus-visible,.btn:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.cert{border-color:#00A859;border-width:3px;box-shadow:0 15px 45px rgba(55,52,53,.08)}
.cert:before{border-color:#FAA954}
.cert .logo-on-cert{margin:0 auto 14px;max-height:90px;max-width:220px;object-fit:contain}
footer{background:#373435;color:#EFEDE7;border-top:0}
footer .wrap{max-width:1100px}
@media(max-width:640px){.mods{grid-template-columns:1fr}.hero{padding:34px 0 29px}.hero h1{font-size:2.75rem}.top .wrap{height:65px}.brand img{height:37px;max-width:110px}.brand-logo-fallback{font-size:1.06rem}.brand-caption{font-size:.52rem}.brand span{display:block}nav.tabs{padding:2px}nav.tabs button{font-size:.78rem;padding:7px 9px}.next{padding:18px}.sunpath{gap:7px}.sunpath .lbl{font-size:.7rem}}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']) .hero{background:linear-gradient(115deg,#30271F,#242424 70%,#1D3025)}:root:not([data-theme='light']) .hero .lede{color:#D9D3CD}:root:not([data-theme='light']) nav.tabs{background:#393536}:root:not([data-theme='light']) nav.tabs button[aria-current='page']{background:#51494A}:root:not([data-theme='light']) .hero .hero-eyebrow{background:#373435;color:#FAA954;border-color:#70573A}:root:not([data-theme='light']) .next{border-color:#4C4443}}
@media print{.hero{background:#fff}.cert{box-shadow:none}}

</style>

<body>
<header class="top">
  <div class="wrap">
    <button class="brand" data-go="home" aria-label="Aspectus onboarding home">
      <img src="aspectus-logo.png" alt="Aspectus logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="brand-logo-fallback" style="display:none">aspectus</span>
      <span class="brand-caption">Learning hub</span>

      <button data-go="home">Home</button>
      <button data-go="toolkit">Toolkit</button>
      <button data-go="brenda">For Brenda</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<footer><div class="wrap">Aspectus Limited internal onboarding. Please don’t share this link outside the company. Powered by Cheche Labs.</div></footer>

<script>
/* ============ CONFIG: swap this block for the next client ============ */
const CONFIG = {
  company: "Aspectus",
  learner: "Ian",
  role: "Social Media Marketing Intern",
  manager: "Brenda",
  startDate: "2026-11-03",
  passMark: 0.8,
  storageKey: "cheche-onboarding-aspectus-ian-v1"
};
const TRACKS = {
  know:   {name:"Know Aspectus",   c:"var(--t1)", soft:"var(--t1-soft)", on:"var(--on-t1)"},
  market: {name:"Market Aspectus", c:"var(--t2)", soft:"var(--t2-soft)", on:"var(--on-t2)"},
  sell:   {name:"Sell Aspectus",   c:"var(--t3)", soft:"var(--t3-soft)", on:"var(--on-t3)"}
};

const BASELINE = [
  {q:"What does “kWp” on a solar system describe?", o:["How much electricity a home uses per month","The peak power the panels can produce","The size of the battery","The price per panel"], a:1, why:"kWp (kilowatt peak) is the maximum output of the panels in full sun. A “20 kWp system” is a way of saying how big it is."},
  {q:"What is the main difference between an on-grid and an off-grid system?", o:["Off-grid systems don’t use panels","On-grid systems stay connected to KPLC power; off-grid systems run independently, usually with batteries","On-grid systems are only for factories","There is no difference"], a:1, why:"On-grid (grid-tied) systems work alongside KPLC. Off-grid systems stand alone, which is why they matter for camps, farms and rural sites. Hybrid systems do both."},
  {q:"What is a tender?", o:["A formal invitation from an organisation for companies to bid for a job","A discount for loyal customers","A type of solar battery","A marketing campaign"], a:0, why:"A tender (or RFQ, RFP) is a formal process where an organisation asks suppliers to submit bids. Aspectus does several every quarter."},
  {q:"Which body licenses solar installers in Kenya?", o:["KEBS","EPRA, the Energy and Petroleum Regulatory Authority","KRA","NEMA"], a:1, why:"EPRA licenses solar PV and solar water heating technicians and companies. Aspectus is EPRA licensed."},
  {q:"A property developer wants to see proof that we can deliver large projects. Which channel suits them best?", o:["TikTok","WhatsApp Status","LinkedIn","X / Twitter"], a:2, why:"Aspectus uses LinkedIn for case studies aimed at developers, institutions and commercial clients."}
];

const MODULES = [
/* ---------------- TRACK 1: KNOW ---------------- */
{id:"m1", track:"know", title:"Who we are in 2026", mins:8,
 intro:"The company, its purpose, its people and where it’s heading this year.",
 body:`
<h3>In one breath</h3>
<p>Aspectus Limited is a Kenyan solar energy company, founded in 2015 by Eng. Sarah Mbwaya. We design, install and maintain solar systems for homes, property developers, businesses, institutions and farms. We are licensed by EPRA for solar PV and solar water heating, and registered with the NCA (category 4).</p>
<h3>Vision and mission</h3>
<div class="card"><h4>Vision</h4><p>To become the sustainable energy solutions company of choice in Africa by 2040.</p></div>
<div class="card"><h4>Mission</h4><p>To improve lives through quality, sustainable and innovative energy solutions.</p></div>
<p>Taglines you can use: <b>“Simply Stellar, Simply Solar”</b> and <b>“Empowering a sustainable future.”</b></p>
<h3>Our values</h3>
<p>Integrity, Innovation, Passion, Collaboration and Sustainability. The team holds weekly core values sessions, and you’re part of them now.</p>
<h3>Who’s who</h3>
<div class="tbl"><table><tr><th>Person</th><th>Role</th><th>Go to them for</th></tr>
<tr><td>Sarah</td><td>Founder and CEO</td><td>Company direction, partnerships, final say on big claims</td></tr>
<tr><td>Brenda</td><td>Sales and Marketing (your manager)</td><td>Approving every post, your priorities, check-ins</td></tr>
<tr><td>Tracy</td><td>Sales and Marketing</td><td>Leads, quotations, campaigns, what clients are asking</td></tr>
<tr><td>Nereah</td><td>Finance and HR</td><td>HR questions, leave, paperwork</td></tr>
<tr><td>Javis</td><td>Technical Manager</td><td>Checking any technical claim, project details and photos</td></tr>
<tr><td>Julius</td><td>Technician</td><td>Site visits, installation footage, how things work</td></tr>
</table></div>
<p>We also have sales agents and technical agents in the regions (Homa Bay and the Coast). They share our WhatsApp posters with their own networks, so they’re part of your audience too.</p>
<h3>Where we work</h3>
<p>Most projects are in Kenya: Nairobi and its suburbs, Rongai, Nanyuki, Diani, Kisii, Malindi and more. Outside Kenya, our largest system is a 265 kWp off-grid plant for a factory in Mogadishu, Somalia.</p>
<h3>Recognition</h3>
<ul><li>Real Estate 100 Awards, Best Solar Solutions Provider: 2022, 2023, 2024 and 2025</li><li>African Excellence Award, 2023</li><li>Top Star Brands Award, 2024</li></ul>
<h3>What we’re focused on this year</h3>
<p>Sarah has set three priorities for 2026 and 2027:</p>
<ol><li><b>Grow sales.</b> More agents, more partners, a weekly pipeline review.</li><li><b>Grow servicing and maintenance.</b> Most clients only call us once. Regular servicing and remote monitoring keep them with us.</li><li><b>Build the people and systems to match the growth.</b> You’re part of this one.</li></ol>
<div class="tip"><strong>Your piece of it:</strong> the marketing goal for the year is to grow to 10,000 followers across all platforms and generate 1,000 leads. TikTok was planned but nobody had time to run it. That’s a big part of why you were hired.</div>
`,
 quiz:[
  {q:"What is Aspectus’s current vision?", o:["To improve people’s lives and create a safer habitable environment","To become the sustainable energy solutions company of choice in Africa by 2040","To be Kenya’s cheapest solar installer","To install solar in every school"], a:1, why:"This is the 2026 vision. The first option is the old 2024 wording, which is retired."},
  {q:"You want to post that a project produces a certain amount of power. Who checks it first?", o:["Nereah","Javis or Julius on the technical team","Nobody, if it’s from the profile","The client"], a:1, why:"Technical claims are checked with the technical team before Brenda approves the post."},

{id:"m2", track:"know", title:"What changed since 2024", mins:6,
 intro:"Older documents are still around. Know which facts are current and which are retired, so you never post an outdated one.",
 body:`
<h3>Which document wins</h3>
<p>If two documents disagree, use this order:</p>
<ol><li>The September 2026 board presentation</li><li>The October 2026 company profile</li><li>Anything older (2024 profile, 2017 training deck, 2022 policies) only if nothing newer covers it</li></ol>
<p>Still unsure? Ask Brenda before you post. That’s always the right answer.</p>
<h3>What changed</h3>
<div class="tbl"><table><tr><th>Topic</th><th>Then (2024 and earlier)</th><th>Now (2026)</th></tr>
<tr><td>Vision</td><td>Improve people’s lives; a safer habitable environment</td><td>Company of choice in Africa by 2040</td></tr>
<tr><td>Story</td><td>Led with climate and the UN goals</td><td>Leads with results: real projects and outcomes</td></tr>
<tr><td>Team</td><td>Profile listed a different sales director and team</td><td>Sarah, Brenda, Tracy, Nereah, Javis, Julius, plus regional agents</td></tr>
<tr><td>Awards</td><td>Real Estate 100, 2022 to 2023</td><td>Real Estate 100, 2022 to 2025, plus African Excellence and Top Star Brands</td></tr>
<tr><td>Licences</td><td>EPRA</td><td>EPRA and NCA 4</td></tr>
<tr><td>Biggest product</td><td>Solar water heating</td><td>Solar PV is now the largest line</td></tr>
<tr><td>Taglines</td><td>“Shine brightest with Solar Power”, “Solar You Can Trust”</td><td>“Simply Stellar, Simply Solar”, “Empowering a sustainable future”</td></tr>
</table></div>
<div class="warn"><strong>Do not post these until Brenda confirms them</strong>
<ul>
<li>Annual revenue and growth figures from the company profile</li>
<li>“98% client retention” and “120+ projects”</li>
<li>Years of experience for individual team members</li>
<li>“Women-owned and women-led” (used in 2024, not in 2026; ask first)</li>
<li>Names of financing partners (banks and lenders)</li>
<li>NCA 3. We are working towards it, but we are NCA 4 today</li>
<li>Electric fencing. It appears in an old deck; check before mentioning it</li>
<li>Anything about revenue, margins, targets or deal values. These are internal only</li>
</ul></div>
`,

  {q:"The 2024 profile and the 2026 profile say different things. Which do you use?", o:["2024, it’s been around longer","2026, and ask Brenda if it’s still unclear","Whichever sounds better","Neither, make your own"], a:1, why:"Newest wins. If it’s still unclear, ask Brenda."},
  {q:"Can you post “We are NCA 3 certified”?", o:["Yes","No. We are NCA 4; NCA 3 is a goal","Only on LinkedIn","Only in tenders"], a:1, why:"Claiming a rating we don’t hold yet could hurt us, especially in tenders."},

{id:"m3", track:"know", title:"What we sell and who buys it", mins:10,
 intro:"You don’t need to be an engineer. You need to explain each product in plain English and know what to ask.",
 body:`
<h3>The products</h3>
<div class="card"><h4>Solar PV systems (on-grid, off-grid, hybrid)</h4>
<p><b>What it is:</b> Panels that make electricity. On-grid works with KPLC, off-grid stands alone with batteries, hybrid does both and keeps the lights on in a blackout.</p>
<p><b>Who buys:</b> Homeowners, businesses, schools, farms, lodges.</p>
<p><b>Plain-English benefit:</b> Lower power bills and no more blackouts.</p>
<p><b>What sales needs to know:</b> What appliances they run and how many. For bigger systems, 3 to 6 months of power bills.</p></div>
<div class="card"><h4>Solar water heating</h4>
<p><b>What it is:</b> Uses the sun to heat water instead of an electric geyser. Comes as tube or flat plate, pressurised or split systems (common sizes 200L and 300L).</p>
<p><b>Who buys:</b> Homeowners, property developers (Kings Developers fitted 258 units with us), hotels.</p>
<p><b>Plain-English benefit:</b> Hot water without the electricity bill.</p>
<p><b>What sales needs to know:</b> Location, number of bedrooms, whether there’s an overhead tank, water type, any booster pump, and tube or flat plate preference.</p></div>
<div class="card"><h4>Solar water pumping and irrigation</h4>
<p><b>Who buys:</b> Farms, boreholes, estates, resorts. <b>Benefit:</b> Pump water without diesel or KPLC.</p></div>
<div class="card"><h4>Solar outdoor lights (street, security, garden)</h4>
<p><b>Who buys:</b> Estates, homes, schools, hotels. <b>Benefit:</b> Security lighting with no wiring and no bills; switches on at dusk by itself.</p>
<p><b>What sales needs to know:</b> The area to light, the type of light, and how many.</p></div>
<div class="card"><h4>Servicing, maintenance and remote monitoring</h4>
<p><b>What it is:</b> A check-up every 6 to 12 months, plus monitoring devices that let clients and us track a system in real time.</p>
<p><b>Who buys:</b> Existing clients, and anyone with a solar system someone else installed.</p>
<p><b>Why it matters:</b> It’s a company priority. Most clients never book a service. Content that explains why servicing matters helps directly.</p></div>
<div class="card"><h4>Agri-solar and innovations</h4>
<p>Solar dryers, egg incubators, solar refrigeration, e-cookers and mobile clinics. Good for educational content; check details with the technical team.</p></div>
<h3>Who buys from us</h3>
<div class="tbl"><table><tr><th>Segment</th><th>What we know</th><th>What they care about</th></tr>
<tr><td>Homeowners</td><td>Our best converters: when they enquire, they often buy</td><td>Bills, blackouts, hot water, security</td></tr>
<tr><td>Property developers</td><td>Now our biggest source of business</td><td>Track record, reliability, delivering on schedule across many units</td></tr>
<tr><td>Commercial and institutions</td><td>Big tickets but harder to close this year</td><td>Cost savings, proof, tenders</td></tr>
<tr><td>Schools and colleges</td><td>Many enquiries, few closes</td><td>Budget, reliability for labs and night classes</td></tr>
<tr><td>Hotels, lodges, camps</td><td>Especially off-grid sites</td><td>Replacing diesel, guest comfort, eco credentials</td></tr>
</table></div>
<h3>How long installs take</h3>
<p>Small homes (1 to 10 kW): 2 to 3 days. Medium systems (12 to 30 kW): about a week. Large projects (50 kW and up): 4 to 6 weeks. Projects tied to construction can run up to 2 years.</p>
<div class="warn"><strong>Never promise</strong> a specific saving, payback time or system size. Those come from a site visit and the technical team’s sizing.</div>
`,
 scenario:{q:"A hotel messages on Instagram: “We spend a lot heating water. Can you help?” What’s the best reply?",
  o:[{t:"“Yes! Our heaters cut bills by 40%. A system for you will cost about Ksh 500,000.”", ok:false, fb:"Never quote savings or prices in a DM. Both depend on a site visit."},
     {t:"“Yes, we’ve done this for hotels like Castel Mara. Could you share your location, number of rooms and a phone number? Our team will call to arrange a site visit.”", ok:true, fb:"Right. A relevant example, the details sales needs, and a handover. Then log it in the pipeline sheet."},
     {t:"“Please call our office.”", ok:false, fb:"Too cold. Collect their details so the lead isn’t lost."}]},
 quiz:[
  {q:"Which segment is now Aspectus’s biggest source of business?", o:["Schools","Property developers","Quarries","Hotels"], a:1, why:"Developers now account for more than half of closed business."},
  {q:"Which segment converts best once they enquire?", o:["Homeowners","Schools","Managed estates","Commercial"], a:0, why:"Homeowners have the highest closing rate. Facebook and Instagram ads aimed at them pay off."},
  {q:"For a large solar PV quote, what does sales usually need from the client?", o:["Their favourite colour","3 to 6 months of power bills","Their KRA PIN","Nothing"], a:1, why:"Bills show how much power they really use, which drives the system size."}
 ],
 task:{prompt:"Pick one product. Write how you’d explain it to a homeowner in four plain-English sentences, with no jargon. Then list two questions you’d need the technical team to answer before posting about it."}
},

{id:"m4", track:"know", title:"How Aspectus runs", mins:7,
 intro:"Where things live, how we treat customers, and the house rules.",
 body:`
<h3>Where things live</h3>
<ul>
<li><b>Email:</b> Google Workspace (Gmail).</li>
<li><b>Sales pipeline:</b> a shared Google Sheet. Every new enquiry from social media gets logged there. Brenda will show you which tab.</li>
<li><b>Weekly pipeline brief:</b> an internal email that goes out on Thursday mornings.</li>
<li><b>Quotations and tenders:</b> handled by sales using standard templates. You support, you don’t price.</li>
</ul>
<h3>Customer service standards</h3>
<div class="tbl"><table><tr><th>Channel</th><th>Standard</th></tr>
<tr><td>Phone</td><td>Answer within 3 to 4 rings and say “Aspectus Limited”. If the person they want isn’t in, take a message and pass it on the same day.</td></tr>
<tr><td>Returning calls</td><td>Within one business day, and within two hours where possible.</td></tr>
<tr><td>Website and social enquiries</td><td>Reply within 24 hours, accurately. Faster is better: a slow reply loses leads.</td></tr>
<tr><td>Written complaints</td><td>Acknowledge within 24 to 48 hours. Try to resolve; if you can’t, escalate to Brenda.</td></tr>
</table></div>
<p>Always: speak respectfully, listen fully before responding, communicate honestly and in plain English, and keep customer details private (Kenya’s Data Protection Act 2019 applies).</p>
<h3>House rules</h3>
<ul>
<li><b>Hours:</b> 8:00am to 5:00pm. Be on time.</li>
<li><b>Dress:</b> business or smart casual. Dress-down Fridays allow jeans, but not when you’re meeting clients or partners.</li>
<li><b>Confidentiality:</b> client and company information stays inside the company. That includes pricing, deal values and internal documents.</li>
<li><b>Gifts:</b> we discourage accepting gifts from clients or partners, and bribery is never allowed.</li>
<li><b>Deadlines:</b> if you can’t meet one, tell Brenda before the due date, not after.</li>
<li><b>Open door:</b> questions and ideas are welcome. Speak up.</li>
</ul>
`,
 scenario:{q:"Someone comments on a Facebook post: “Two weeks and my installation still isn’t done. Terrible service.” What do you do?",
  o:[{t:"Delete the comment.", ok:false, fb:"Deleting looks like hiding. Others may have seen it already."},
     {t:"Reply publicly to explain whose fault the delay was.", ok:false, fb:"Never argue in public, and you don’t know the full story yet."},
     {t:"Reply publicly with a short, polite acknowledgement and invite them to DM or call; then tell Brenda straight away so the right person follows up.", ok:true, fb:"Right. Acknowledge, take it private, escalate. Log it so it’s followed through."}]},
 quiz:[
  {q:"How quickly should a social media enquiry get a reply?", o:["Within a week","Within 24 hours, faster if possible","Only on Mondays","When sales has time"], a:1, why:"Our standard is 24 hours. Speed wins leads."},
  {q:"A client’s phone number came through a DM. Can you share it in a public reply?", o:["Yes","No, customer details stay private","Only with their name","Only on WhatsApp"], a:1, why:"Customer privacy is part of our policy and Kenyan law."},
  {q:"You realise you won’t finish a task by Friday. When do you tell Brenda?", o:["On Monday","Before Friday","Never","Only if she asks"], a:1, why:"Flag it before the due date so the plan can change."}
 ],

},

{id:"m5", track:"market", title:"Our voice and what we can claim", mins:8,
 intro:"How we sound, what we can prove, and how a post gets approved.",
 body:`
<h3>How we sound</h3>
<ul><li><b>Plain English.</b> Write for a homeowner, not an engineer.</li><li><b>Lead with the outcome.</b> “No more blackouts” before “12 kWp hybrid”.</li><li><b>Specific beats vague.</b> Real projects, real places, real system sizes.</li><li><b>Honest.</b> We never exaggerate. Our reputation is our marketing.</li></ul>
<h3>Brand basics</h3>
<p>Colours: orange #FAA954, green #00A859, red #9B1D20, black #373435. Use the official logo files only; never stretch or recolour the logo.</p>
<h3>Proof points you can use</h3>
<ul>
<li>EPRA licensed for solar PV and solar water heating; NCA 4 registered</li>
<li>Real Estate 100 Awards, Best Solar Solutions Provider, 2022 to 2025</li>
<li>Kings Developers: solar water heaters for Eden Gardens (72 units), Vintage (120) and Apollo (66)</li>
<li>265 kWp off-grid system for a factory in Mogadishu, replacing diesel</li>
<li>80 kWp grid-tied system on a farm in Timau</li>
<li>Kamburaini School, Naro Moru: a hybrid system powering computer labs</li>
<li>Design and supervision of a 4.3 MW hybrid system for the Baricho Water Works in Malindi</li>
<li>2026 completions such as Mwitu (16.4 kW, Karen), a 20 kW system in Kiambu, 6 kW for pool heating in Lavington</li>
</ul>
<h3>The claim rules</h3>
<ol>
<li>Savings are never promised. Say what a specific client experienced, and name the source.</li>
<li>Every technical number is checked with Javis or Julius.</li>
<li>Client names, homes and photos need the client’s permission. Homeowners especially: never show a house number or exact location.</li>
<li>A nice WhatsApp message is not a testimonial until the client agrees it can be published.</li>
</ol>
<h3>How a post gets approved</h3>
<ol><li>You draft the post (visual, caption, call to action).</li><li>If it has a technical claim, the technical team checks it.</li><li>Brenda approves it.</li><li>You publish, then log any enquiries it brings in.</li></ol>
`,
 scenario:{q:"A prospect asks: “Will you guarantee my bill drops by 50%?” Best response?",
  o:[{t:"“Yes, guaranteed.”", ok:false, fb:"We can’t guarantee that, and it creates a complaint later."},
     {t:"“Savings depend on how you use power. Our team sizes every system after a site visit, so you’ll get a figure based on your actual usage. Can I arrange that?”", ok:true, fb:"Honest, helpful, and it moves them to the next step."},
     {t:"“No.”", ok:false, fb:"True but unhelpful. Explain why and offer the next step."}]},
 quiz:[
  {q:"A client sends a glowing WhatsApp review. Can you post it as a testimonial today?", o:["Yes","Only after the client agrees it can be published","Only without their name","Only on TikTok"], a:1, why:"Permission first, always."},
  {q:"Who gives final approval for your posts?", o:["You","Brenda","Javis","Any agent"], a:1, why:"Brenda approves every post. Technical claims get checked by the technical team first."},
  {q:"Which caption follows our voice best?", o:["“Leveraging cutting-edge photovoltaic synergies.”","“No more blackouts in Kitengela: a 12 kW system, installed in a week.”","“BEST SOLAR EVER!!!”","“Solar is good.”"], a:1, why:"Outcome first, specific, plain English."}
 ],
 task:{prompt:"Pick one 2026 completed project from the list above. Draft a LinkedIn post about it: the outcome, the system, one line on the client type, and a call to action. Note which details need checking with the technical team."}
},

{id:"m6", track:"market", title:"The social media playbook", mins:10,
 intro:"Each platform has a job. This is the strategy the team presented to the board in September 2026.",
 body:`
<h3>Which platform does what</h3>
<div class="tbl"><table><tr><th>Platform</th><th>Audience</th><th>Content</th><th>We measure</th></tr>
<tr><td>Facebook and Instagram</td><td>Homeowners and small businesses</td><td>Project completions with specs, educational posts (myths, “did you know”), seasonal product posts, newsletters. Paid ads that open WhatsApp or Messenger.</td><td>Enquiries from ads, cost per lead</td></tr>
<tr><td>LinkedIn</td><td>Developers, institutions, commercial clients</td><td>Medium and large project case studies, technical completions, newsletters, milestones and awards</td><td>Profile views, follower growth</td></tr>
<tr><td>WhatsApp Status</td><td>Warm leads and past customers</td><td>Product posters, seasonal promotions, project highlights. Agents reshare these to their contacts.</td><td>Messages received per post</td></tr>
<tr><td>TikTok</td><td>18 and over, broad awareness</td><td>Installation slideshows, before and after, product spotlights</td><td>Views and watch time</td></tr>
<tr><td>X / Twitter</td><td>General</td><td>Mirror of Facebook and Instagram, nothing extra</td><td>Low priority</td></tr>
</table></div>
<h3>What we’ve learned so far</h3>
<ul><li>Follower growth spikes when we run paid ads. Organic months are flat, so consistency matters.</li><li>LinkedIn grows slowly but steadily.</li><li>Awareness posts alone don’t bring leads. Product-specific posts with a clear “message us on WhatsApp” do.</li></ul>
<h3>Your targets for the year</h3>
<p>10,000 followers across all platforms and 1,000 leads. You’ll report followers, leads and cost per lead to Brenda monthly.</p>
<h3>The Tuesday Energy Tip</h3>
<p>A weekly post that informs and educates. Rotate the theme: a practical tip, a “did you know?”, something funny, a new technology, or a new energy law. Every tip with a technical claim gets checked first.</p>
<h3>Turning happy customers into content</h3>
<p>After every installation, sales follows up with a feedback form. It asks what the customer liked and whether they have referrals. Positive answers become testimonials (with permission), and referrals go straight into the pipeline.</p>
<h3>When a message comes in</h3>
<ol><li><b>Enquiry:</b> reply within 24 hours, collect name, phone, location and what they need, log it in the pipeline sheet, and hand it to sales.</li><li><b>Complaint:</b> acknowledge politely, move it to DM or phone, tell Brenda the same day.</li><li><b>Question you can’t answer:</b> say you’ll find out, then check with the right person. Never guess.</li></ol>
`,
 scenario:{q:"Javis sends you a spec sheet for a new inverter, and you don’t fully understand it. What happens before it’s posted?",
  o:[{t:"Copy the spec sheet into a caption.", ok:false, fb:"Customers won’t understand it either, and you could misstate something."},
     {t:"Ask Javis to explain the key benefit in plain words, draft the post, have him check it, then send it to Brenda.", ok:true, fb:"Right. Understand it, translate it, verify it, get approval."},
     {t:"Skip it.", ok:false, fb:"New products are good content. Just check them first."}]},
 quiz:[
  {q:"Where should a case study about a 60 kW commercial project go first?", o:["TikTok","LinkedIn","X","Nowhere"], a:1, why:"LinkedIn reaches developers, institutions and commercial buyers."},
  {q:"What do we measure for WhatsApp Status posts?", o:["Likes","Messages received per post","Shares on X","Nothing"], a:1, why:"WhatsApp Status is about direct conversations with warm leads."},
  {q:"A new enquiry comes in by DM. After replying, what’s the next step?", o:["Nothing","Log it in the pipeline sheet and hand it to sales","Post about it","Wait for them to call"], a:1, why:"A lead that isn’t logged gets lost."}
 ],
 task:{prompt:"Draft three Tuesday Energy Tips. For each one, write: the visual idea, the caption, the call to action, and the technical claim that needs checking. Brenda will review them."}
},

{id:"m7", track:"sell", title:"The sales journey and your part in it", mins:8,
 intro:"How a stranger becomes a client, and where marketing makes the difference.",
 body:`
<h3>The journey</h3>
<ol>
<li><b>Lead generation:</b> referrals, social media, events, site visits. <i>This is mostly you.</i></li>
<li><b>Qualify:</b> is this a good fit? What do they need?</li>
<li><b>Contact:</b> a call, email or meeting.</li>
<li><b>Site visit and sizing:</b> the team collects details and sizes the system.</li>
<li><b>Proposal and quotation.</b></li>
<li><b>Objections and negotiation:</b> the quote may be revised.</li>
<li><b>Close:</b> award letter, proforma invoice, deposit.</li>
<li><b>Delivery:</b> sourcing, installation, testing, training the client, completion certificate.</li>
<li><b>Follow-up:</b> feedback, referrals, maintenance schedule. <i>You help here too.</i></li>
</ol>
<p>If a deal is lost, the team looks at why. Lost clients are worth reaching back out to later.</p>
<h3>Where your job ends and sales begins</h3>
<p>You own the lead until it’s logged in the pipeline sheet with the right details and handed to sales. Sales owns it from the first call. Collect:</p>
<ul><li>Name and phone number</li><li>Location (area, not exact address)</li><li>What they’re interested in</li><li>Type of client (home, developer, business, school, hotel, farm)</li><li>Where they found us (which post, ad or platform)</li></ul>
<p>That last one matters. It’s how we know which content brings business.</p>
<h3>Keeping clients</h3>
<p>Our retention approach: reply fast, deliver within one or two days where possible, follow up after installation (a few days later, a week later, then regularly), run satisfaction checks, and handle complaints properly. Content that keeps past clients engaged, like servicing reminders and energy tips, supports this.</p>
<h3>Ways we make buying easier</h3>
<p>We work with financing partners so some clients can pay over time. Check with Brenda before naming any partner publicly.</p>
`,
 scenario:{q:"A school bursar asks for a quotation through Facebook. What do you collect, and where does it go?",
  o:[{t:"Send them a price list.", ok:false, fb:"Prices depend on sizing, and price lists are internal."},
     {t:"Collect the contact person, phone, school name and location, what they want powered, and how they found us; log it in the pipeline sheet and hand it to sales.", ok:true, fb:"Right. Sales will arrange the visit and quotation."},
     {t:"Tell them to email info@.", ok:false, fb:"You risk losing the lead. Capture it yourself."}]},
 quiz:[
  {q:"Why record where a lead found us?", o:["It’s not needed","It shows which content and platforms bring business","For the client’s records","For KRA"], a:1, why:"It’s how marketing proves its value and learns what works."},
  {q:"Who prepares quotations?", o:["You","Sales, after sizing","The client","Nobody"], a:1, why:"Quotes come after a site visit and sizing by the team."},
  {q:"At which two stages does marketing contribute most?", o:["Lead generation and follow-up","Installation and testing","Invoicing and payment","Sourcing materials"], a:0, why:"You bring leads in and help keep clients engaged afterwards."}
 ],
 task:{prompt:"Write a short WhatsApp message template you could use to reply to any new enquiry and collect the five details sales needs. Keep it warm and under 60 words."}
},

{id:"m8", track:"sell", title:"Tenders 101", mins:9,
 intro:"Tenders bring the biggest projects. Your job is to make sure nothing is missing and nothing is late.",
 body:`
<h3>The words you’ll hear</h3>
<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Tender</td><td>A formal invitation to bid for a job</td></tr>
<tr><td>RFQ / RFP</td><td>Request for quotation / request for proposal: smaller or less formal versions</td></tr>
<tr><td>Prequalification (PQQ)</td><td>Getting onto an organisation’s approved supplier list before tenders come out</td></tr>
<tr><td>BOQ</td><td>Bill of quantities: the itemised list of materials and work to price</td></tr>
<tr><td>Tender security</td><td>A bank or insurance guarantee some tenders require with the bid</td></tr>
<tr><td>Power of attorney</td><td>A document authorising someone to sign on the company’s behalf</td></tr>
</table></div>
<h3>How Aspectus does a tender</h3>
<ol>
<li>Read the entire tender.</li>
<li>Pick out every requirement, mandatory and technical.</li>
<li>Check with the team that we can deliver.</li>
<li>Go through the BOQ and note what’s needed.</li>
<li>Start sourcing materials.</li>
<li>Start filling in the tender document.</li>
<li>Gather the required documents (tender security, power of attorney and others).</li>
<li>Cost the BOQ in a spreadsheet, comparing markups.</li>
<li>Transfer the final prices into the tender’s BOQ.</li>
<li>Confirm every document is ready and correctly filled, then submit.</li>
</ol>
<h3>Your part (to start)</h3>
<ul><li>Keep the company document pack current and in one place.</li><li>Pull together the company profile, project references and photos.</li><li>Track deadlines and remind the team early.</li><li>Do the final completeness check against the requirements list.</li></ul>
<p>Pricing and costing stay with sales and finance.</p>
<h3>Documents commonly requested</h3>
<p>Every tender lists its own; always check. These come up often:</p>

function quizHTML(list, stateObj, prefix){
  return list.map((q,i)=>{ const ans=stateObj[i]; return `<div class="q"><p class="qt">${i+1}. ${q.q}</p>${q.o.map((o,j)=>{ let cls=""; if(ans!=null){ if(j===q.a) cls="right"; else if(j===ans) cls="wrong"; } return `<button class="opt ${cls}" data-q="${prefix}${i}" data-o="${j}" ${ans!=null?"disabled":""}>${o}</button>`; }).join("")}${ans!=null?`<div class="fb"><b>${ans===q.a?"Correct.":"Not quite."}</b> ${q.why}</div>`:""}</div>`; }).join("");
}

  app.innerHTML = `<div class="wrap"><button class="back" onclick="go('home')">← Back to learning home</button>
    <p class="kicker">LET'S BEGIN · QUESTION ${current+1} OF ${BASELINE.length}</p>

}

function moduleView(id){
  const m = MODULES.find(x=>x.id===id); const st = ms(id); const T=TRACKS[m.track];
  const q = quizScore(m); const allAnswered = q.n===q.total; const passed = q.c/q.total >= CONFIG.passMark;
  const idx = MODULES.indexOf(m); const nextM = MODULES[idx+1];
  app.innerHTML = `<div class="wrap" style="${trackStyle(m.track)}">
    <button class="back" onclick="go('home')">← Home</button>
    <div class="modhead"><p class="kicker">${T.name} · Module ${idx+1} of ${MODULES.length} · ${m.mins} min</p><h1 style="font-size:clamp(1.8rem,6vw,2.5rem)">${m.title}</h1><p class="lede">${m.intro}</p></div>
    <div class="prose">${m.body}</div>
    ${m.scenario?`<div class="stage"><p class="label">What would you do?</p><p class="qt"><b>${m.scenario.q}</b></p>${m.scenario.o.map((o,j)=>{ let cls=""; if(st.scen!=null){ if(o.ok) cls="right"; else if(j===st.scen) cls="wrong"; } return `<button class="opt ${cls}" data-s="${j}" ${st.scen!=null?"disabled":""}>${o.t}</button>`; }).join("")}${st.scen!=null?`<div class="fb">${m.scenario.o[st.scen].fb}${m.scenario.o[st.scen].ok?"":" The highlighted option is the stronger response."}</div>`:""}</div>`:""}
    <div class="stage"><p class="label">Quick check · you need ${Math.round(CONFIG.passMark*100)}% to complete the module</p>${quizHTML(m.quiz, st.quiz, "q")}
      ${allAnswered && !passed?`<button class="btn ghost" id="retry">Try the quiz again</button>`:""}</div>
    <div class="stage"><p class="label">Practice task · ${CONFIG.manager} will review this</p><p><b>${m.task.prompt}</b></p>
      <textarea id="task" placeholder="Write your answer here. It saves on this device as you type.">${esc(st.task||"")}</textarea><div class="saved" id="savedMsg"></div></div>
    <div class="done-bar">
      <span>${st.done?"Module complete.":allAnswered?(passed?`Quiz: ${q.c}/${q.total}. Ready to complete.`:`Quiz: ${q.c}/${q.total}. Review and try again.`):`Answer the quiz to finish.`}</span>
      ${st.done ? (nextM?`<button class="btn" id="nextMod">Next module</button>`:`<button class="btn" onclick="go('brenda')">Send summary to ${CONFIG.manager}</button>`)
                : `<button class="btn green" id="complete" ${allAnswered&&passed?"":"disabled"}>Mark module complete</button>`}
    </div></div>`;
  // Present one small learning step at a time, preserving the original content and quizzes.
  const steps=[];
  const prose=app.querySelector(".prose");
  if(prose){
    const children=Array.from(prose.children);
    let bucket=[];
    children.forEach((child,i)=>{
      if(child.tagName==="H3"&&bucket.length){steps.push(bucket);bucket=[];}
      bucket.push(child);
      if(bucket.length>=3){steps.push(bucket);bucket=[];}
    });
    if(bucket.length)steps.push(bucket);
    const parent=prose.parentElement;
    steps.forEach((group,i)=>{const pane=document.createElement("section");pane.className="stage guided-step";pane.innerHTML='<p class="label">Learn · Part '+(i+1)+'</p>';group.forEach(c=>pane.appendChild(c));parent.insertBefore(pane,prose);});
    prose.remove();
  }
  const scenario=app.querySelector(".stage:not(.guided-step)");
  if(scenario&&m.scenario)scenario.classList.add("guided-step");
  const quizStage=app.querySelector(".stage:not(.guided-step)");
  if(quizStage){
    const questions=Array.from(quizStage.querySelectorAll(".q"));
    questions.forEach((q,i)=>{const pane=document.createElement("section");pane.className="stage guided-step";pane.innerHTML='<p class="label">Knowledge check · '+(i+1)+' of '+questions.length+'</p>';pane.appendChild(q);quizStage.parentElement.insertBefore(pane,quizStage);});
    const retry=quizStage.querySelector("#retry");if(retry){const finalQuiz=quizStage.previousElementSibling;finalQuiz.appendChild(retry);}
    quizStage.remove();
  }
  const task=app.querySelector(".stage:not(.guided-step)");
  if(task)task.classList.add("guided-step");
  const doneBar=app.querySelector(".done-bar");
  if(doneBar)doneBar.classList.add("guided-step");
  const panes=Array.from(app.querySelectorAll(".guided-step"));
  const max=panes.length-1;st.page=Math.max(0,Math.min(st.page||0,max));
  const active=panes[st.page];
  panes.forEach((p,i)=>p.style.display=i===st.page?"":"none");
  const controls=document.createElement("div");controls.className="done-bar guided-controls";
  const isQuestion=!!active?.querySelector(".q");
  const isScenario=!!active?.querySelector("[data-s]");
  const isTask=!!active?.querySelector("#task");
  const isComplete=active===doneBar;
  const questionIndex=isQuestion?Number(active.querySelector(".q .opt")?.dataset.q?.slice(1)):null;
  const blocked=(isQuestion&&st.quiz[questionIndex]==null)||(isScenario&&st.scen==null)||(isTask&&!String(st.task||"").trim());
  controls.innerHTML='<span class="small">Step '+(st.page+1)+' of '+panes.length+'</span><div style="display:flex;gap:10px"><button class="btn ghost" id="prevStep" '+(st.page===0?'disabled':'')+'>Back</button>'+(isComplete?'':'<button class="btn orange" id="forwardStep" '+(blocked?'disabled':'')+'>Continue →</button>')+'</div>';
  const host=app.querySelector(".wrap");host.appendChild(controls);
  controls.querySelector("#prevStep").onclick=()=>{st.page--;save();moduleView(id);};
  const forward=controls.querySelector("#forwardStep");if(forward)forward.onclick=()=>{st.page=Math.min(max,st.page+1);save();moduleView(id);};
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ st.scen=+b.dataset.s; save(); moduleView(id); });
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ st.quiz[+b.dataset.q.slice(1)] = +b.dataset.o; save(); const result=quizScore(m); if(result.n===result.total){window.parent.postMessage({source:"aspectus-original-quiz",type:"quiz-result",moduleOrder:MODULES.findIndex(x=>x.id===m.id)+1,correct:result.c,total:result.total,answers:st.quiz},"*");} const y=window.scrollY; moduleView(id); window.scrollTo(0,y); });
  const ta=document.getElementById("task"); let t; ta.oninput=()=>{ st.task=ta.value; const forward=app.querySelector("#forwardStep");if(forward)forward.disabled=!st.task.trim(); clearTimeout(t); t=setTimeout(()=>{ save(); document.getElementById("savedMsg").textContent="Saved on this device"; },400); };
  const r=document.getElementById("retry"); if(r) r.onclick=()=>{ st.quiz={}; st.page=0; save(); const y=window.scrollY; moduleView(id); window.scrollTo(0,y); };
  const c=document.getElementById("complete"); if(c) c.onclick=()=>{ if(!String(st.task||"").trim()){alert("Please write your practical task before completing this module.");return;} const result=quizScore(m); window.parent.postMessage({source:"aspectus-original-quiz",type:"practical-task",moduleOrder:MODULES.findIndex(x=>x.id===m.id)+1,task:st.task,correct:result.c,total:result.total,answers:st.quiz},"*"); st.done=true; save(); moduleView(id); };
  const n=document.getElementById("nextMod"); if(n) n.onclick=()=>go("module",{id:nextM.id});
}

function summaryText(){
  const lines=[]; const done=MODULES.filter(m=>ms(m.id).done).length;
  lines.push(`${CONFIG.company} onboarding summary: ${CONFIG.learner}`);
  lines.push(`Date: ${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})} (day ${Math.max(dayNum(),1)})`);
  lines.push(`Baseline check: ${S.baseline?`${S.baseline.c}/${S.baseline.total}`:"not taken"}`);
  lines.push(`Modules complete: ${done}/${MODULES.length}`,"");
  MODULES.forEach((m,i)=>{ const q=quizScore(m); const st=ms(m.id);
    lines.push(`${i+1}. ${m.title}: ${st.done?"complete":"in progress"}, quiz ${q.c}/${q.total}${m.scenario&&st.scen!=null?`, scenario ${m.scenario.o[st.scen].ok?"handled well":"needs discussion"}`:""}`);
    if(st.task) lines.push(`   Task: ${st.task.replace(/\n+/g," / ")}`); });
  lines.push("", `Questions for ${CONFIG.manager}: ${S.questions||"none yet"}`);
  return lines.join("\n");
}

function certView(){
  const scores = MODULES.map(m=>quizScore(m)); const c=scores.reduce((a,s)=>a+s.c,0), t=scores.reduce((a,s)=>a+s.total,0);
  app.innerHTML = `<div class="wrap"><button class="back no-print" onclick="go('brenda')">← Back</button>
    <div class="cert">
      <img class="logo-on-cert" src="aspectus-logo.png" alt="Aspectus logo" onerror="this.style.display='none'">
      <p>Aspectus Limited</p>
      <h2>Learning completion record</h2>
      <p>This certifies that</p>
      <div class="name">${CONFIG.learner}</div>
      <p>has completed the Aspectus onboarding programme for the role of ${CONFIG.role}, covering all eight modules with a quiz score of ${c}/${t}.</p>
      <p>${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</p>
      <p style="margin-top:28px">Practical task review is completed separately with ${CONFIG.manager}.</p>
      <div class="stripe"><span style="background:#373435"></span><span style="background:#FAA954"></span><span style="background:#00A859"></span></div>
      <p style="font-size:.8rem;margin-top:14px;color:#6B6466">An internal learner-generated progress record, not manager approval. Powered by Cheche Labs.</p>
    </div>
    <p class="no-print" style="margin-top:16px"><button class="btn" onclick="window.print()">Print or save as PDF</button></p></div>`;
}

render();
</script>
</body>

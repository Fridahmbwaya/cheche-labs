{id:"m7", track:"sell", title:"The sales journey and your part in it", mins:8,
 intro:"How a stranger becomes a client, and where marketing makes the difference.",
 body:`
<h3>The big idea: a conversation becomes valuable when it is handed over well</h3><p>Marketing opens the door, but the whole team helps a prospect move from enquiry to installation and follow-up.</p><div class="card"><h4>What you will take away</h4><p>You will be able to capture the essential lead details, pass a useful handoff to sales and follow up without overpromising.</p></div><div class="card"><h4>Picture yourself at work</h4><p>A school bursar messages Aspectus after a Facebook post and asks for a price. A guessed quote could lose trust; a clear, timely handoff can create a genuine opportunity.</p></div>
<h3>One real-world journey: from message to relationship</h3><p>A school bursar sees an Aspectus post and asks for a quotation. Ian's job starts before there is a sale: listen, capture enough information to help and make sure someone follows up. The sales team then investigates the opportunity rather than guessing a price.</p><div class="card"><h4>Why these steps exist</h4><p>The Aspectus Sales Process starts with <b>lead generation</b>, then <b>qualify/research</b> and <b>contact</b>. It moves to <b>pitch/send proposal/negotiations</b>, <b>overcome objections</b>, <b>close the deal</b> and <b>follow up</b>. Each step answers a question: Is this a potential customer? What do they need? Can we propose a fit? What is stopping a decision? How do we keep the relationship?</p></div><div class="card"><h4>And the story doesn't end at closing</h4><p>The sales-process document explicitly includes getting feedback, nurturing the relationship, considering cross-selling and asking for referrals. Marketing can help make those follow-ups useful rather than treating customers as finished transactions.</p></div><h3>The official sales journey</h3>
<ol>
<li><b>Lead generation:</b> referrals, social media, events, site visits. <i>This is mostly you.</i></li>
<li><b>Qualify:</b> is this a good fit? What do they need?</li>
<li><b>Contact:</b> a call, email or meeting.</li>
<li><b>Site visit and sizing:</b> the team collects details and sizes the system.</li>
<li><b>Proposal and quotation.</b></li>
<li><b>Objections and negotiation:</b> the quote may be revised.</li>
<li><b>Close:</b> award letter, proforma invoice, deposit.</li>
<li><b>Delivery:</b> sourcing, installation, testing, training the client, completion certificate.</li>
<li><b>Follow-up:</b> feedback, referrals, maintenance schedule. <i>You help here too.</i></li>
</ol>
<p>If a deal is lost, the team looks at why. Lost clients are worth reaching back out to later.</p>
<h3>Where your job ends and sales begins</h3>
<p>You own the lead until it’s logged in the pipeline sheet with the right details and handed to sales. Sales owns it from the first call. Collect:</p>
<ul><li>Name and phone number</li><li>Location (area, not exact address)</li><li>What they’re interested in</li><li>Type of client (home, developer, business, school, hotel, farm)</li><li>Where they found us (which post, ad or platform)</li></ul>
<p>That last one matters. It’s how we know which content brings business.</p>
<h3>Keeping clients</h3>
<p>Our retention approach: reply fast, deliver within one or two days where possible, follow up after installation (a few days later, a week later, then regularly), run satisfaction checks, and handle complaints properly. Content that keeps past clients engaged, like servicing reminders and energy tips, supports this.</p>
<h3>Ways we make buying easier</h3>
<p>We work with financing partners so some clients can pay over time. Check with Brenda before naming any partner publicly.</p>
`,
 scenario:{q:"A school bursar asks for a quotation through Facebook. What do you collect, and where does it go?",
  o:[{t:"Send them a price list.", ok:false, fb:"Prices depend on sizing, and price lists are internal."},
     {t:"Collect the contact person, phone, school name and location, what they want powered, and how they found us; log it in the pipeline sheet and hand it to sales.", ok:true, fb:"Right. Sales will arrange the visit and quotation."},
     {t:"Tell them to email info@.", ok:false, fb:"You risk losing the lead. Capture it yourself."}]},
 quiz:[
  {q:"Why record where a lead found us?", o:["It’s not needed","It shows which content and platforms bring business","For the client’s records","For KRA"], a:1, why:"It’s how marketing proves its value and learns what works."},
  {q:"Who prepares quotations?", o:["You","Sales, after sizing","The client","Nobody"], a:1, why:"Quotes come after a site visit and sizing by the team."},
  {q:"At which two stages does marketing contribute most?", o:["Lead generation and follow-up","Installation and testing","Invoicing and payment","Sourcing materials"], a:0, why:"You bring leads in and help keep clients engaged afterwards."}
 ],
 task:{prompt:"A follower sends a direct message asking for a solar solution. Draft a friendly opening reply, a simple five-field lead capture checklist, and a concise handoff message to sales. Include a short follow-up when the customer has not replied."}
},

{id:"m8", track:"market", title:"Planning a social media campaign", mins:10,
 intro:"Put everything together: audience, message, content plan, creative and measurement.",
 body:`
<h3>The big idea: turn everything you have learned into a campaign</h3><p>A strong campaign links an audience, one goal, relevant messages, approved creative and a way to learn from the results.</p><div class="card"><h4>What you will take away</h4><p>You will be able to create a simple one-week campaign brief, plan three connected posts, produce a sample and identify two meaningful metrics.</p></div><div class="card"><h4>Picture yourself at work</h4><p>Brenda wants more qualified enquiries for one Aspectus solution next week. Instead of posting at random, you will build a small campaign with a purpose.</p></div>
<h3>From scattered posts to one connected story</h3><p>Imagine Brenda asks Ian to promote solar water heating. He could post a product photo on Monday, an award on Wednesday and a random energy tip on Friday. That is activity — but it may not tell one audience why they should care or what to do.</p><div class="card"><h4>Build the campaign backwards</h4><p>Start with the change you want: for example, relevant homeowners or developers asking for more information. Then decide what the audience must understand before taking action. A connected sequence can introduce the problem, explain a verified solution and invite a conversation.</p></div><div class="card"><h4>Use a consistent example</h4><p>The 2024 company profile includes solar water heating at Eden Gardens (72 units). That may be a useful starting point for a developer-focused content concept, but check technical facts, photos and permission before treating it as an approved case study.</p></div><h3>Choose one campaign objective</h3>
<p>A campaign is a group of posts working toward one outcome. For Aspectus, choose an objective such as awareness of solar water heating, more qualified enquiries, or education about solar PV. Avoid trying to achieve everything at once.</p>
<div class="card"><h4>Campaign brief</h4><p>Record four things: the audience, the goal, the one key message and the action you want them to take.</p></div>
<h3>Choose the audience</h3>
<p>A homeowner looking at monthly energy bills and a developer specifying systems for new apartments need different messages. Choose one audience and write for their concerns.</p>
<h3>Build a three-post sequence</h3>
<ol><li><b>Get attention.</b> Introduce a customer problem or surprising insight.</li><li><b>Build confidence.</b> Explain how an Aspectus solution works or show a verified installation.</li><li><b>Invite action.</b> Make the next step simple: send an enquiry, ask for advice or request a consultation.</li></ol>
<h3>The content calendar</h3>
<p>For each post, capture: day, platform, format (photo, carousel or graphic), opening hook, visual asset, caption angle and call to action. Three clear rows are enough for this mini-campaign.</p>
<div class="card"><h4>Keep production manageable</h4><p>Plan all three posts, but fully design only one creative. Reuse approved Aspectus photos and your existing templates where possible.</p></div>
<h3>Measure what matters</h3>
<p>Match metrics to your goal. Reach and saves can help assess awareness or education; relevant direct messages and qualified enquiries are more useful when the objective is lead generation.</p>
<h3>Before anything goes live</h3>
<ul><li>Check technical claims with Javis or Julius.</li><li>Confirm photo and client permissions.</li><li>Use Aspectus colors and approved branding.</li><li>Send every post to Brenda for approval before publishing.</li></ul>
`,
 scenario:{q:"The objective is to generate enquiries from homeowners about solar water heating. Which call to action fits best?",
  o:[{t:"Send us a DM with your household's hot-water needs.",ok:true,fb:"Right. A specific next step can start a useful sales conversation."},{t:"Like this post if you love sunshine.",ok:false,fb:"Likes are engagement, not necessarily customer enquiries."},{t:"Follow for more inspiration.",ok:false,fb:"Following may build an audience but does not directly qualify a lead."}]},
 quiz:[
  {q:"What should a campaign brief clarify first?",o:["Every hashtag","One objective and target audience","The final photo filter","The number of likes to promise"],a:1,why:"Start with a clear goal and the people you want to reach."},
  {q:"Which content calendar entry is most useful?",o:["Tuesday: post something","Tuesday: carousel, homeowner audience, hook, visual, CTA","Three emojis","Post whenever free"],a:1,why:"A usable plan identifies the message, format, asset and next step."},
  {q:"Which metric best supports a lead-generation campaign?",o:["Any impression","Qualified product enquiries","Logo size","Number of words"],a:1,why:"Meaningful enquiries reflect the campaign objective."},
  {q:"What must happen before publishing a project photo?",o:["Nothing if it looks professional","Only add a hashtag","Confirm permissions, verify claims and get Brenda's approval","Let the app approve automatically"],a:2,why:"Company and client approval rules still apply."}
 ],
 task:{prompt:"Plan a three-post, one-week social campaign for one Aspectus solution. Submit a short campaign brief (audience, objective, key message), a three-row content calendar (format, hook and CTA), one sample graphic or carousel slide with a caption, and two success metrics. Submit for Brenda review; do not publish."}
}
];

const TOOLKIT = `
<h2>Toolkit</h2>
<p class="note">Quick references you’ll come back to. Everything here is also in the modules.</p>
<section class="block"><h3>Who to ask</h3><div class="tbl"><table>
<tr><th>Need</th><th>Ask</th></tr>
<tr><td>Post approval, priorities</td><td>Brenda</td></tr>
<tr><td>Leads, quotes, campaign ideas</td><td>Brenda or Tracy</td></tr>
<tr><td>Technical claims, specs, project details</td><td>Javis or Julius</td></tr>
<tr><td>HR, leave, paperwork</td><td>Nereah</td></tr>
<tr><td>Company direction, partnerships</td><td>Sarah, through Brenda</td></tr></table></div></section>
<section class="block"><h3>Before you publish</h3><div class="card"><ul>
<li>Is every fact from a 2026 source?</li><li>Has any technical number been checked by Javis or Julius?</li><li>Do I have permission for client names, photos and quotes?</li><li>No prices, savings promises, revenue or targets?</li><li>Plain English, outcome first, clear call to action?</li><li>Has Brenda approved it?</li></ul></div></section>
<section class="block"><h3>New enquiry: collect these</h3><div class="card"><ol>
<li>Name and phone</li><li>Location (area)</li><li>What they’re interested in</li><li>Type of client</li><li>Where they found us</li></ol><p>Then log it in the pipeline sheet and hand it to sales.</p></div></section>
<section class="block"><h3>Response times</h3><div class="card"><ul>
<li>Social and website enquiries: within 24 hours</li><li>Calls: within one business day, two hours if possible</li><li>Written complaints: acknowledge within 24 to 48 hours, escalate if unresolved</li></ul></div></section>
<section class="block"><h3>Monthly report for Brenda</h3><div class="card"><ul>
<li>Followers per platform, and total against 10,000</li><li>Leads from social, and from which platform or post</li><li>Cost per lead on paid ads</li><li>Top three posts and why they worked</li><li>One thing to try next month</li></ul></div></section>
`;

const MILESTONES = [
 {id:"w1", t:"Week 1: Understand", when:"by 9 Nov", items:["Completes all eight modules with quiz scores of 80% or more","Lists outdated content on current social pages","Knows who to ask for what"]},
 {id:"w2", t:"Week 2: Apply", when:"by 16 Nov", items:["Three Tuesday Energy Tips drafted, claims checked, one published","First posts approved by Brenda and published","Every social enquiry logged in the pipeline sheet","First TikTok from a completed project"]},
 {id:"d30", t:"Day 30: Own", when:"by 3 Dec", items:["Runs a weekly content calendar across all platforms, with Brenda approving","Posts on TikTok every week","Sends the first monthly report: followers, leads, cost per lead","Keeps the tender document pack current for one live tender"]}
];

const WEEK = [
 {d:"2026-11-03", lbl:"Tue 3 Nov", t:"Orientation with Brenda. Meet the team. Baseline check. Modules 1 and 2."},
 {d:"2026-11-04", lbl:"Wed 4 Nov", t:"Modules 3 and 4. Ask Javis or Julius to walk you through one product."},
 {d:"2026-11-05", lbl:"Thu 5 Nov", t:"Modules 5 and 6. Draft your three Energy Tips."},
 {d:"2026-11-06", lbl:"Fri 6 Nov", t:"Modules 7 and 8. Look at one past tender with Brenda."},
 {d:"2026-11-09", lbl:"Mon 9 Nov", t:"Send your summary to Brenda. Week 1 check-in and plan for week 2."}
];

/* ================= STATE ================= */
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storageKey)) || fresh(); }catch(e){ return fresh(); } }
function fresh(){ return {baseline:null, mods:{}, signoff:{}, questions:""}; }
function save(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(S)); }catch(e){} }
function ms(id){ return S.mods[id] || (S.mods[id] = {quiz:{}, scen:null, task:"", done:false}); }
function quizScore(m){ const st=ms(m.id); let c=0,n=0; m.quiz.forEach((q,i)=>{ if(st.quiz[i]!=null){n++; if(st.quiz[i]===q.a)c++;} }); return {c,n,total:m.quiz.length}; }
function modState(m){ const st=S.mods[m.id]; if(!st) return "new"; if(st.done) return "done"; return (Object.keys(st.quiz).length||st.task||st.scen!=null)?"prog":"new"; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function dayNum(){ const s=new Date(CONFIG.startDate+"T00:00:00"); const d=Math.floor((new Date()-s)/864e5)+1; return d; }

/* ================= VIEWS ================= */
const app = document.getElementById("app");
const requestedModule = new URLSearchParams(window.location.search).get("module");
let view = requestedModule==="baseline" ? {name:"baseline"} : requestedModule && /^m[1-8]$/.test(requestedModule) ? {name:"module",id:requestedModule} : {name:"home"};
function go(name, extra){ if(new URLSearchParams(window.location.search).get("locked")==="1" && (name!=="module" || (extra && extra.id!==requestedModule))) return; view = Object.assign({name}, extra||{}); render(); window.scrollTo(0,0); }
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.go===view.name?"page":"false"));
  if(view.name==="home") homeView();
  else if(view.name==="baseline") baselineView();
  else if(view.name==="module") moduleView(view.id);
  else if(view.name==="toolkit") app.innerHTML = `<div class="wrap prose">${TOOLKIT}</div>`;
  else if(view.name==="brenda") brendaView();
  else if(view.name==="cert") certView();
}

function trackStyle(t){ const T=TRACKS[t]; return `--tc:${T.c};--tc-soft:${T.soft};--on-tc:${T.on}`; }

function homeView(){
  const dn = dayNum();
  const dayTxt = dn<1 ? `You start on Tuesday 3 November` : dn<=30 ? `Day ${dn} of 30` : `Onboarding complete window`;
  const next = !S.baseline ? {t:"Start with a quick baseline check", s:"5 questions, about 3 minutes. It isn’t graded.", act:()=>go("baseline")}
    : (()=>{ const m = MODULES.find(m=>!ms(m.id).done); return m ? {t:`Next: ${m.title}`, s:`${TRACKS[m.track].name}, about ${m.mins} minutes`, act:()=>go("module",{id:m.id})} : {t:"All modules complete", s:"Send your summary to Brenda and view your learning record.", act:()=>go("brenda")}; })();
  const segs = Object.keys(TRACKS).map(t=>{ const ms_=MODULES.filter(m=>m.track===t); const d=ms_.filter(m=>ms(m.id).done).length; return `<div class="seg"><div class="bar"><div class="fill" style="width:${Math.round(d/ms_.length*100)}%;background:${TRACKS[t].c}"></div></div><div class="lbl">${TRACKS[t].name} ${d}/${ms_.length}</div></div>`; }).join("");
  const today = new Date().toISOString().slice(0,10);
  app.innerHTML = `
  <div class="hero"><div class="wrap">
    <div class="hero-eyebrow">Your Aspectus learning journey</div><p class="kicker">${dayTxt}</p>
    <h1>Karibu, ${CONFIG.learner}<span style="color:#00A859">.</span></h1>
    <p class="lede">This is your guide to Aspectus and to your role as ${CONFIG.role}. Work through it at your own pace. ${CONFIG.manager} will check in with you along the way.</p>
    <div class="sunpath">${segs}</div>
    <div class="next"><div><h3>${next.t}</h3><div class="note">${next.s}</div></div><button class="btn" id="nextBtn">Continue</button></div>
  </div></div>
  <div class="wrap">
    ${Object.keys(TRACKS).map(t=>`
    <section class="block"><div class="track-h"><span class="dot" style="background:${TRACKS[t].c}"></span><h2>${TRACKS[t].name}</h2></div>
      <div class="mods">${MODULES.filter(m=>m.track===t).map(m=>{ const st=modState(m); const n=MODULES.indexOf(m)+1; const q=quizScore(m); return `
        <button class="mod" data-mod="${m.id}" style="${trackStyle(t)}">
          <span class="ring ${st}">${st==="done"?"✓":n}</span>
          <span><b>${m.title}</b><br><span class="meta">${m.mins} min${q.n?` · quiz ${q.c}/${q.total}`:""}</span></span>
          ${st==="done"?`<span class="badge wait">Ready for review</span>`:""}
        </button>`; }).join("")}</div>
    </section>`).join("")}
    <section class="block"><h2>Your first week</h2>
      <div class="days" style="margin-top:12px">${WEEK.map(w=>`<div class="day ${w.d===today?"today":""}"><b>${w.lbl}</b><span>${w.t}</span></div>`).join("")}</div>
    </section>
    <section class="block"><h2>What success looks like</h2>
      <p class="note">Draft milestones for ${CONFIG.manager} to confirm with you.</p>
      <div class="milestones">${MILESTONES.map(m=>`<div class="ms"><h3><span>${m.t}</span><span class="note">${m.when}</span></h3><ul>${m.items.map((it,i)=>`<li>${it}</li>`).join("")}</ul></div>`).join("")}</div>
    </section>
  </div>`;
  document.getElementById("nextBtn").onclick = next.act;
  app.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>go("module",{id:b.dataset.mod}));
}

function quizHTML(list, stateObj, prefix){
  return list.map((q,i)=>{ const ans=stateObj[i]; return `<div class="q"><p class="qt">${i+1}. ${q.q}</p>${q.o.map((o,j)=>{ let cls=""; if(ans!=null){ if(j===q.a) cls="right"; else if(j===ans) cls="wrong"; } return `<button class="opt ${cls}" data-q="${prefix}${i}" data-o="${j}" ${ans!=null?"disabled":""}>${o}</button>`; }).join("")}${ans!=null?`<div class="fb"><b>${ans===q.a?"Correct.":"Not quite."}</b> ${q.why}</div>`:""}</div>`; }).join("");
}

function baselineView(){
 if(S.baseline){go("module",{id:"m1"});return;}
 const st=S._bl||(S._bl={});
 const current=Math.min(Math.max(S._blStep||0,0),BASELINE.length-1);
 const question=BASELINE[current],answer=st[current],answered=answer!=null;
 app.innerHTML=`<div class="wrap baseline-layout"><section class="baseline-card">
  <div class="baseline-meta"><span>BEFORE WE BEGIN</span><strong>QUESTION ${current+1} / ${BASELINE.length}</strong></div>
  <div class="baseline-meter"><span style="width:${(current+1)/BASELINE.length*100}%"></span></div>
  <h1 class="baseline-question-title">${question.q}</h1>
  <div class="baseline-answers">${question.o.map((option,j)=>`<button class="opt ${!answered?"":j===question.a?"right":j===answer?"wrong":"muted-option"}" data-o="${j}" ${answered?"disabled":""} aria-pressed="${answer===j}">${option}${answered&&j===question.a?'<span class="answer-check">✓</span>':""}</button>`).join("")}</div>
  ${answered?`<div class="baseline-feedback ${answer===question.a?"success":"correction"}"><strong>${answer===question.a?"Correct!":"Here's the right answer"}</strong><p>${question.why||"The green answer is the correct choice."}</p></div>`:""}
  <div class="baseline-actions"><button id="blBack" class="btn ghost" ${current===0?"disabled":""}>← Back</button><button id="blNext" class="btn orange" ${!answered?"disabled":""}>${current===BASELINE.length-1?"Start Module 1 →":"Next question →"}</button></div>
  </section></div>`;
 app.querySelectorAll(".baseline-answers .opt").forEach(b=>b.onclick=()=>{st[current]=+b.dataset.o;save();baselineView();});
 document.getElementById("blBack").onclick=()=>{S._blStep=Math.max(0,current-1);save();baselineView();};
 document.getElementById("blNext").onclick=()=>{if(st[current]==null)return;if(current<BASELINE.length-1){S._blStep=current+1;save();baselineView();return;}let c=0;BASELINE.forEach((q,i)=>{if(st[i]===q.a)c++;});S.baseline={c,total:BASELINE.length};save();go("module",{id:"m1"});};
}

function moduleView(id){
  const m = MODULES.find(x=>x.id===id); const st = ms(id); const T=TRACKS[m.track];
  const q = quizScore(m); const allAnswered = q.n===q.total; const passed = q.c/q.total >= CONFIG.passMark;
  const idx = MODULES.indexOf(m); const nextM = MODULES[idx+1];
  app.innerHTML = `<div class="wrap" style="${trackStyle(m.track)}">
    <div class="modhead"><p class="kicker">${T.name} · Module ${idx+1} of ${MODULES.length} · ${m.mins} min</p><h1 style="font-size:clamp(1.8rem,6vw,2.5rem)">${m.title}</h1><p class="lede">${m.intro}</p></div>
    <div class="prose">${m.body}</div>
    ${m.scenario?`<div class="stage"><p class="label">What would you do?</p><p class="qt"><b>${m.scenario.q}</b></p>${m.scenario.o.map((o,j)=>{ let cls=""; if(st.scen!=null){ if(o.ok) cls="right"; else if(j===st.scen) cls="wrong"; } return `<button class="opt ${cls}" data-s="${j}" ${st.scen!=null?"disabled":""}>${o.t}</button>`; }).join("")}${st.scen!=null?`<div class="fb">${m.scenario.o[st.scen].fb}${m.scenario.o[st.scen].ok?"":" The highlighted option is the stronger response."}</div>`:""}</div>`:""}
    <div class="stage"><p class="label">Quick check · you need ${Math.round(CONFIG.passMark*100)}% to complete the module</p>${quizHTML(m.quiz, st.quiz, "q")}
      ${allAnswered && !passed?`<div class="retry-notice"><strong>Retry the quiz to unlock your assignment.</strong><p>Review the explanations above, then try again.</p><button type="button" class="btn orange retry-quiz-action">↻ Retry quiz →</button></div>`:""}</div>
    <div class="done-bar"><div><p class="label">STEP 2 · APPLY YOUR LEARNING</p><h3 style="margin:5px 0 7px">Ready to put it into practice?</h3><p style="margin:0">Your quiz score: ${q.c}/${q.total}. ${passed?"Next, share your practical assignment with Brenda.":"Retry the quiz to unlock your assignment."}</p><p style="margin:9px 0 0;font-size:.9rem;color:#6B6466">${m.task.prompt}</p></div>${allAnswered&&!passed?`<button type="button" class="btn orange retry-quiz-action">↻ Retry quiz →</button>`:`<button class="btn green" id="complete" ${allAnswered&&passed?"":"disabled"}>Continue to assignment →</button>`}
    </div></div>`;
  // Present one small learning step at a time, preserving the original content and quizzes.
  const steps=[];
  const prose=app.querySelector(".prose");
  if(prose){
    const children=Array.from(prose.children);
    let bucket=[];
    children.forEach((child,i)=>{
      if(child.tagName==="H3"&&bucket.length){steps.push(bucket);bucket=[];}
      bucket.push(child);
      if(bucket.length>=3){steps.push(bucket);bucket=[];}
    });
    if(bucket.length)steps.push(bucket);
    const parent=prose.parentElement;
    steps.forEach((group,i)=>{
      const pane=document.createElement("section");
      const kind=group.some(c=>c.classList.contains("tbl"))?"people":group.some(c=>c.classList.contains("card"))?"principles":group.some(c=>c.tagName==="UL"||c.tagName==="OL")?"highlights":i%3===0?"spotlight":i%3===1?"story":"insight";
      pane.className="stage guided-step lesson-card lesson-"+kind;
      pane.innerHTML='<div class="lesson-eyebrow"><span class="lesson-chip">'+({spotlight:"☀ THE BIG PICTURE",story:"✦ THE STORY",insight:"↗ WHY IT MATTERS",principles:"◈ OUR FOUNDATIONS",highlights:"✓ KEY TAKEAWAYS",people:"◎ MEET THE TEAM"}[kind])+'</span><span>'+String(i+1).padStart(2,"0")+' / '+String(steps.length).padStart(2,"0")+'</span></div>';
      const content=document.createElement("div");content.className="lesson-content";
      group.forEach(c=>content.appendChild(c));
      const topic=(content.querySelector("h3")?.textContent||"").toLowerCase();
      if(topic.includes("one breath")){
        const graphic=document.createElement("div");graphic.className="lesson-big-fact";
        graphic.innerHTML='<span class="fact-kicker">THE ASPECTUS STORY</span><strong>2015<span class="fact-spark">✳</span></strong><small>Rooted in Kenya. Powered by solar.</small>';
        pane.appendChild(graphic);
      }else if(topic.includes("values")){
        const tag=document.createElement("div");tag.className="lesson-playful-tag";tag.textContent="WHAT WE STAND FOR ✳";pane.appendChild(tag);
      }else if(topic.includes("recognition")){
        const tag=document.createElement("div");tag.className="lesson-playful-tag";tag.textContent="A LITTLE BRAG MOMENT ✦";pane.appendChild(tag);
      }
      // Larger ideas and shorter facts deserve different visual rhythms.
      if(kind==="highlights"){
        content.querySelectorAll("li").forEach((li,j)=>{li.style.setProperty("--item-index",String(j+1));});
      }
      if(kind==="story"||kind==="insight"){
        const paragraphs=content.querySelectorAll(":scope > p");
        if(paragraphs.length>1)paragraphs[0].classList.add("lesson-lead");
      }
      pane.appendChild(content);
      parent.insertBefore(pane,prose);
    });
    prose.remove();
  }
  const scenario=app.querySelector(".stage:not(.guided-step)");
  if(scenario&&m.scenario)scenario.classList.add("guided-step");
  const quizStage=app.querySelector(".stage:not(.guided-step)");
  if(quizStage){
    const questions=Array.from(quizStage.querySelectorAll(".q"));
    questions.forEach((q,i)=>{const pane=document.createElement("section");pane.className="stage guided-step";pane.innerHTML='<p class="label">Knowledge check · '+(i+1)+' of '+questions.length+'</p>';pane.appendChild(q);quizStage.parentElement.insertBefore(pane,quizStage);});
    const retry=quizStage.querySelector(".retry-notice");if(retry){const finalQuiz=quizStage.previousElementSibling;finalQuiz.appendChild(retry);}
    quizStage.remove();
  }
  const task=app.querySelector(".stage:not(.guided-step)");
  if(task)task.classList.add("guided-step");
  const doneBar=app.querySelector(".done-bar");
  if(doneBar)doneBar.classList.add("guided-step");
  const panes=Array.from(app.querySelectorAll(".guided-step"));
  const max=panes.length-1;st.page=Math.max(0,Math.min(st.page||0,max));
  const active=panes[st.page];
  panes.forEach((p,i)=>p.style.display=i===st.page?"":"none");
  const controls=document.createElement("div");controls.className="done-bar guided-controls";
  const isQuestion=!!active?.querySelector(".q");
  const isScenario=!!active?.querySelector("[data-s]");
  const isTask=!!active?.querySelector("#task");
  const isComplete=active===doneBar;
  const questionIndex=isQuestion?Number(active.querySelector(".q .opt")?.dataset.q?.slice(1)):null;
  const blocked=(isQuestion&&st.quiz[questionIndex]==null)||(isScenario&&st.scen==null)||(isTask&&!String(st.task||"").trim());
  controls.innerHTML='<span class="small">Step '+(st.page+1)+' of '+panes.length+'</span><div style="display:flex;gap:10px"><button class="btn ghost" id="prevStep" '+(st.page===0?'disabled':'')+'>Back</button>'+(isComplete?'':'<button class="btn orange" id="forwardStep" '+(blocked?'disabled':'')+'>Continue →</button>')+'</div>';
  const host=app.querySelector(".wrap");host.appendChild(controls);
  document.body.classList.add("stage-focused");
  controls.querySelector("#prevStep").onclick=()=>{st.page--;save();moduleView(id);window.scrollTo(0,0);};
  const forward=controls.querySelector("#forwardStep");if(forward)forward.onclick=()=>{st.page=Math.min(max,st.page+1);save();moduleView(id);window.scrollTo(0,0);};
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ st.scen=+b.dataset.s; save(); moduleView(id); });
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ st.quiz[+b.dataset.q.slice(1)] = +b.dataset.o; save(); const result=quizScore(m); if(result.n===result.total){window.parent.postMessage({source:"aspectus-original-quiz",type:"quiz-result",moduleOrder:MODULES.findIndex(x=>x.id===m.id)+1,correct:result.c,total:result.total,answers:st.quiz},"*");} const y=window.scrollY; moduleView(id); window.scrollTo(0,y); });
  // The practical assignment is managed by the parent learner page, not this lesson.
  // Both the final knowledge-check screen and the completion screen restart at question one.
  app.querySelectorAll(".retry-quiz-action").forEach(button=>button.addEventListener("click",event=>{
    event.preventDefault();
    st.quiz={};
    const firstQuestion=panes.findIndex(p=>p.querySelector(".q"));
    st.page=firstQuestion<0?0:firstQuestion;
    save();
    moduleView(id);
    window.scrollTo(0,0);
  }));
  const c=document.getElementById("complete"); if(c) c.onclick=()=>{if(!allAnswered||!passed)return;window.parent.postMessage({source:"aspectus-original-quiz",type:"open-assignment",moduleOrder:idx+1},"*");};
  const n=document.getElementById("nextMod"); if(n) n.onclick=()=>go("module",{id:nextM.id});
}

function summaryText(){
  const lines=[]; const done=MODULES.filter(m=>ms(m.id).done).length;
  lines.push(`${CONFIG.company} onboarding summary: ${CONFIG.learner}`);
  lines.push(`Date: ${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})} (day ${Math.max(dayNum(),1)})`);
  lines.push(`Baseline check: ${S.baseline?`${S.baseline.c}/${S.baseline.total}`:"not taken"}`);
  lines.push(`Modules complete: ${done}/${MODULES.length}`,"");
  MODULES.forEach((m,i)=>{ const q=quizScore(m); const st=ms(m.id);
    lines.push(`${i+1}. ${m.title}: ${st.done?"complete":"in progress"}, quiz ${q.c}/${q.total}${m.scenario&&st.scen!=null?`, scenario ${m.scenario.o[st.scen].ok?"handled well":"needs discussion"}`:""}`);
    if(st.task) lines.push(`   Task: ${st.task.replace(/\n+/g," / ")}`); });
  lines.push("", `Questions for ${CONFIG.manager}: ${S.questions||"none yet"}`);
  return lines.join("\n");
}

function brendaView(){
  const allDone = MODULES.every(m=>ms(m.id).done);
  app.innerHTML = `<div class="wrap">
    <h2>For ${CONFIG.manager}</h2>
    <p>${CONFIG.learner}: add any questions below, then copy your summary and send it to ${CONFIG.manager} by email or WhatsApp.</p>
    <label for="qs"><b>Questions or anything unclear</b></label>
    <textarea id="qs" style="min-height:100px" placeholder="E.g. Which tab of the pipeline sheet do I use?">${esc(S.questions)}</textarea>
    <h3 style="margin-top:24px">Your summary</h3>
    <pre class="sum" id="sum">${esc(summaryText())}</pre>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="copy">Copy summary</button><a class="btn ghost" id="mail" href="#">Open in email</a><span class="saved" id="copied"></span></div>

    <section class="block"><h2>${CONFIG.manager}’s sign-off</h2>
      <p class="note">Manager review happens directly with ${CONFIG.manager}. This learner copy does not record or certify manager approval. Use the summary below during your check-in.</p>
      <div class="card"><strong>Review checklist</strong><p>Ask ${CONFIG.manager} to review your practical tasks, discuss any questions, and confirm your progress outside this page.</p></div>
    </section>
    <section class="block"><h2>Learning record</h2>
      <p>${allDone?"All modules are complete.":"Unlocks when all eight modules are complete."}</p>
      <button class="btn green" ${allDone?"":"disabled"} onclick="go('cert')">View learning record</button>
    </section>
    <section class="block"><button class="btn ghost" id="reset">Reset all progress on this device</button></section>
  </div>`;
  const qs=document.getElementById("qs"); qs.oninput=()=>{ S.questions=qs.value; save(); document.getElementById("sum").textContent=summaryText(); };
  document.getElementById("copy").onclick=async()=>{ try{ await navigator.clipboard.writeText(summaryText()); document.getElementById("copied").textContent="Copied"; }catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById("sum")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.getElementById("copied").textContent="Selected. Press copy."; } };
  document.getElementById("mail").onclick=(e)=>{ e.preventDefault(); location.href=`mailto:?subject=${encodeURIComponent(CONFIG.company+" onboarding summary: "+CONFIG.learner)}&body=${encodeURIComponent(summaryText().slice(0,1800))}`; };

  document.getElementById("reset").onclick=()=>{ if(confirm("Reset all progress on this device? This can’t be undone.")){ S=fresh(); save(); go("home"); } };
}

function certView(){
  const scores = MODULES.map(m=>quizScore(m)); const c=scores.reduce((a,s)=>a+s.c,0), t=scores.reduce((a,s)=>a+s.total,0);
  app.innerHTML = `<div class="wrap"><button class="back no-print" onclick="go('brenda')">← Back</button>
    <div class="cert">
      <img class="logo-on-cert" src="aspectus-logo.png" alt="Aspectus logo" onerror="this.style.display='none'">
      <p>Aspectus Limited</p>
      <h2>Learning completion record</h2>
      <p>This certifies that</p>
      <div class="name">${CONFIG.learner}</div>
      <p>has completed the Aspectus onboarding programme for the role of ${CONFIG.role}, covering all eight modules with a quiz score of ${c}/${t}.</p>
      <p>${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</p>
      <p style="margin-top:28px">Practical task review is completed separately with ${CONFIG.manager}.</p>
      <div class="stripe"><span style="background:#373435"></span><span style="background:#FAA954"></span><span style="background:#00A859"></span></div>
      <p style="font-size:.8rem;margin-top:14px;color:#6B6466">An internal learner-generated progress record, not manager approval. Powered by Cheche Labs.</p>
    </div>
    <p class="no-print" style="margin-top:16px"><button class="btn" onclick="window.print()">Print or save as PDF</button></p></div>`;
}

render();
</script>
